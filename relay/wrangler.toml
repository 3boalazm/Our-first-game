name = "ourfirstgame"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The game (WebGL build + PWA files) is copied into ./public before deploying.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Objects on the free plan must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
